[project]
name = "prosperstartup-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carlosagustii", email = "carlosacanga03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
prosperstartup-ai = "prosperstartup_ai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
